schema_version: 1

context:
  version: "1.2.0"

package:
  name: vera-explain
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vera-explain/vera_explain-${{ version }}.tar.gz
  sha256: e28ceb5e1040470bf0f40d7612b656bb249a766479ebce737ae6e073af8ba50e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - pandas
    - scipy
    - scikit-learn
    - kdepy
    - contourpy
    - shapely >=2
    - matplotlib-base >=3.6
    - glasbey
    - networkx
    - requests
    - tqdm

tests:
  - python:
      imports:
        - vera
        - vera.explain
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Your 2D embeddings, explained. Automatically.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pavlin-policar/vera
  repository: https://github.com/pavlin-policar/vera

extra:
  recipe-maintainers:
    - pavlin-policar
